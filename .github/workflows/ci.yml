name: CI/CD

on:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t krishnna26/library-backend:latest ./backend

      - name: Push backend image
        run: docker push krishnna26/library-backend:latest

      - name: Build frontend image
        run: docker build --build-arg VITE_API_URL=http://3.111.55.170:3000 -t krishnna26/library-frontend:latest ./frontend

      - name: Push frontend image
        run: docker push krishnna26/library-frontend:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull krishnna26/library-backend:latest
            docker pull krishnna26/library-frontend:latest

            docker stop library-backend || true
            docker rm library-backend || true

            docker stop library-frontend || true
            docker rm library-frontend || true

            docker run -d \
              --name library-backend \
              -p 3000:3000 \
              -e MONGO_URI='${{ secrets.MONGO_URI }}' \
              -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
              -e PORT=3000 \
              krishnna26/library-backend:latest

            docker run -d \
              --name library-frontend \
              -p 80:80 \
              krishnna26/library-frontend:latest